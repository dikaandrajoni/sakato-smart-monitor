# Config Mosquitto untuk sakato-smart-monitor.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# ---- Produksi: aktifkan autentikasi ----
# 1. Buat user & password di dalam container:
#      docker exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd <nama-user>
#    (JANGAN commit file 'passwd' ke repo — sudah di-cover .gitignore bila
#     ditaruh di folder ini dengan nama 'passwd'.)
# 2. Uncomment dua baris di bawah ini, lalu restart container:
# password_file /mosquitto/config/passwd
# allow_anonymous false
#
# Untuk Fase 3 (laptop, jaringan rumah sendiri), allow_anonymous true
# sudah cukup. Aktifkan password sebelum expose ke internet / VPS.
